name: Crytinox Backend Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  debug-build:
    name: Debug and Find Path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show me the files
        run: |
          echo "Current location: $(pwd)"
          echo "Files in current location:"
          ls -R
          echo "Looking for go.mod:"
          find . -name "go.mod"