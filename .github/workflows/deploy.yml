name: Crytinox Backend Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Debug: List all files
      run: ls -R

    - name: Set up Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Verify Dependencies and Build Test
      run: |
        # We removed the 'cd' because your files are likely in the root.
        # If this fails, look at the 'ls -R' output in the logs to see where go.mod is.
        go mod download
        go build -v -o test_binary .

  deploy:
    name: Continuous Deployment (CD)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          cd ~/CryptoProject-Backend
          git reset --hard origin/main
          git pull origin main
          go build -o crytinox_api .
          sudo systemctl restart crytinox